<!-- Page web du cadre : menu Batterie (courbe, périodes de charge, autonomie, temps d'éveil) -->
<script>
// --- Historique de la batterie : courbe et estimation de l'autonomie ---
var histoBat = null, joursBat = 7;
function chargerBatterie() {
  var deux = config.ecrans && config.ecrans.nb === 2;
  var lire = function (n) { return api('/api/batterie' + (n ? '?ecran=1' : '')).then(function (r) { return r.json(); }).catch(function () { return { pts: [] }; }); };
  return Promise.all(deux ? [lire(0), lire(1)] : [lire(0)]).then(function (h) { histoBat = h; dessinerBatterie(joursBat); });
}
// Depuis la derniere recharge : pente (en % par jour) par moindres carres.
// Les 6 h qui suivent une charge sont ignorees : la tension y redescend d'elle-meme (relaxation de la
// batterie) sans qu'elle se vide, ce qui ferait croire a une consommation plusieurs fois trop forte.
// Apres un trou de plus de 12 h (batterie debranchee, carte changee), on repart des mesures suivantes.
function estimation(pts) {
  var debut = 0, ch = periodesCharge(pts);
  if (ch.length) { var apres = ch[ch.length - 1][1] + 6 * 60; while (debut < pts.length && pts[debut][0] < apres) debut++; }
  for (var i = debut + 1; i < pts.length; i++) if (pts[i][0] - pts[i - 1][0] > 720) debut = i;
  var p = pts.slice(debut).map(function (q) { return [q[0] / 1440, pctPoint(q)]; });
  if (p.length < 6 || p[p.length - 1][0] - p[0][0] < 0.5) return null;
  var n = p.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  p.forEach(function (q) { sx += q[0]; sy += q[1]; sxx += q[0] * q[0]; sxy += q[0] * q[1]; });
  var pente = (n * sxy - sx * sy) / (n * sxx - sx * sx);
  return { pente: pente, depuis: p[0][0], actuel: Math.round(p[n - 1][1]) };
}
// Temps d'eveil et d'ecran par jour sur les dernieres 24 h, d'apres les compteurs cumules de la carte
// (5e et 6e valeurs des points, en dixiemes de seconde). Un compteur qui baisse = carte redemarree.
function eveilParJour(pts) {
  var dernier = pts.length ? pts[pts.length - 1][0] : 0;
  var p = pts.filter(function (q) { return q[0] >= dernier - 1440 && q.length > 5 && q[4] !== null; });
  if (p.length < 2 || p[p.length - 1][0] - p[0][0] < 180) return null;
  var ev = 0, ee = 0;
  for (var i = 1; i < p.length; i++) {
    var dv = p[i][4] - p[i - 1][4], de = p[i][5] - p[i - 1][5];
    ev += dv >= 0 ? dv : p[i][4];
    ee += de >= 0 ? de : p[i][5];
  }
  var jours = (p[p.length - 1][0] - p[0][0]) / 1440;
  return { eveil: ev / 10 / jours, ecran: ee / 10 / jours };
}
function enMinSec(s) { s = Math.round(s); return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + ('0' + s % 60).slice(-2) + ' s'; }
// Pourcentage d'un point de l'historique : celui de la jauge de la carte quand il existe (3e valeur, en
// dixiemes), sinon deduit de la tension (anciennes mesures, ou carte sans jauge)
function pctPoint(q) {
  return q.length > 2 && q[2] !== null && q[2] !== undefined ? Math.min(100, q[2] / 10) : pourcentage(q[1] / 1000);
}
// Periodes de charge : une montee de la tension d'au moins 0,06 V au total. Une charge lente (~ 0,01 V
// par heure, a peine plus que le bruit de mesure) continue tant que la tension ne retombe pas de plus de
// 0,02 V sous son maximum. Mais un palier bruite peut alors s'etirer sur des heures avant une montee
// franche (chargeur rapide de la Feather : +0,17 V en une heure) : la charge commence donc a la derniere
// mesure encore au niveau d'avant (a 15 mV pres du plus bas de la periode), pas a la premiere petite hausse.
// Renvoie [debut, fin, enCours] (minutes) ; enCours : la charge dure jusqu'a la derniere mesure.
function periodesCharge(pts) {
  var res = [], i = 0;
  while (i < pts.length - 1) {
    if (pts[i + 1][1] - pts[i][1] <= 5 || pts[i + 1][0] - pts[i][0] > 300) { i++; continue; }   // pas de montee (> 5 mV)
    var deb = i, j = i + 1, max = j;
    while (j + 1 < pts.length && pts[j + 1][1] >= pts[max][1] - 20 && pts[j + 1][0] - pts[j][0] <= 300) {
      j++;
      if (pts[j][1] >= pts[max][1]) max = j;
    }
    var bas = pts[deb][1], k;
    for (k = deb; k < max; k++) bas = Math.min(bas, pts[k][1]);
    for (k = max - 1; k > deb && pts[k][1] > bas + 15; k--);
    deb = k;
    if (pts[max][1] - pts[deb][1] >= 60) res.push([pts[deb][0], pts[max][0], j === pts.length - 1]);
    i = Math.max(max, i + 1);
  }
  // Avec la jauge (4e valeur : vitesse en dixiemes de % par heure), toute mesure faite pendant une charge
  // (au moins +2 % par heure) en fait partie, depuis la mesure precedente
  for (var a = 0; a < pts.length; a++) {
    if (!(pts[a][3] >= 20)) continue;
    var b = a;
    while (b + 1 < pts.length && pts[b + 1][3] >= 20 && pts[b + 1][0] - pts[b][0] <= 300) b++;
    res.push([a && pts[a][0] - pts[a - 1][0] <= 300 ? pts[a - 1][0] : pts[a][0], pts[b][0], b === pts.length - 1]);
    a = b;
  }
  // Periodes qui se chevauchent (trouvees par la tension et par la jauge) : une seule
  res.sort(function (x, y) { return x[0] - y[0]; });
  var fusion = [];
  res.forEach(function (c) {
    var l = fusion[fusion.length - 1];
    if (!l || c[0] > l[1]) fusion.push(c.slice());
    else if (c[1] > l[1]) { l[1] = c[1]; l[2] = c[2]; }
    else if (c[1] === l[1]) l[2] = l[2] || c[2];
  });
  return fusion;
}
function dessinerBatterie(jours) {
  joursBat = jours;
  var b = document.querySelectorAll('[data-jours]');
  for (var i = 0; i < b.length; i++) b[i].classList.toggle('actif', +b[i].getAttribute('data-jours') === jours);
  if (!histoBat) return;
  var cv = $('courbeBatterie'), r = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W) {                                        // page pas encore affichee : on reessaie un peu plus tard
    if ($('menu-batterie').open) setTimeout(function () { dessinerBatterie(jours); }, 200);
    return;
  }
  cv.width = W * r; cv.height = H * r;
  var ctx = cv.getContext('2d'); ctx.scale(r, r);
  var css = getComputedStyle(document.documentElement);
  var cTexte = css.getPropertyValue('--texte').trim(), cDoux = css.getPropertyValue('--doux').trim(), cTrait = css.getPropertyValue('--trait').trim();
  var g = 46, d = 8, hh = 10, bas = 22, fin = Date.now() / 60000, debut = fin - jours * 1440;
  var X = function (m) { return g + (m - debut) / (fin - debut) * (W - g - d); };
  var Y = function (p) { return hh + (100 - p) / 100 * (H - hh - bas); };
  ctx.font = '12px -apple-system, system-ui, sans-serif'; ctx.lineWidth = 1;
  // Periodes de charge : fond grise et mention "en charge"
  var charges = histoBat.map(function (h) { return periodesCharge(h.pts); });
  charges.forEach(function (liste) {
    liste.forEach(function (c) {
      var x1 = Math.max(g, X(c[0])), x2 = Math.min(W - d, X(c[1]));
      if (x2 <= g || x1 >= W - d) return;
      ctx.fillStyle = cTrait; ctx.globalAlpha = 0.55;
      ctx.fillRect(x1, hh, Math.max(2, x2 - x1), H - hh - bas);
      ctx.globalAlpha = 1;
      if (x2 - x1 >= 52) { ctx.fillStyle = cDoux; ctx.textAlign = 'center'; ctx.fillText('en charge', (x1 + x2) / 2, hh + 14); }
    });
  });
  [0, 25, 50, 75, 100].forEach(function (p) {
    ctx.strokeStyle = cTrait; ctx.beginPath(); ctx.moveTo(g, Y(p) + 0.5); ctx.lineTo(W - d, Y(p) + 0.5); ctx.stroke();
    ctx.fillStyle = cDoux; ctx.textAlign = 'right'; ctx.fillText(p + ' %', g - 6, Y(p) + 4);
  });
  // Jours en bas (minuit, heure du navigateur)
  var j0 = new Date(debut * 60000); j0.setHours(24, 0, 0, 0);
  var pas = Math.max(1, Math.ceil(52 * jours / (W - g - d)));          // assez de place pour chaque date
  ctx.textAlign = 'center';
  for (var dj = new Date(j0), k = 0; dj.getTime() < fin * 60000; dj.setDate(dj.getDate() + 1), k++) {   // de minuit en minuit (heure d'ete comprise)
    if (k % pas) continue;
    var t = dj.getTime(), x = X(t / 60000);
    ctx.strokeStyle = cTrait; ctx.beginPath(); ctx.moveTo(x + 0.5, hh); ctx.lineTo(x + 0.5, H - bas); ctx.stroke();
    var dt = new Date(t);
    ctx.fillStyle = cDoux; ctx.fillText(['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'][dt.getDay()] + ' ' + dt.getDate(), x, H - 6);
  }
  var texte = [];
  histoBat.forEach(function (h, n) {
    var pts = h.pts.filter(function (q) { return q[0] >= debut; });
    ctx.strokeStyle = cTexte; ctx.lineWidth = 2; ctx.setLineDash(n ? [6, 4] : []);
    ctx.beginPath();
    pts.forEach(function (q, i) {
      var x = X(q[0]), y = Y(pctPoint(q));
      if (i && q[0] - pts[i - 1][0] > 180) ctx.moveTo(x, y); else if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);   // trou > 3 h : pas de trait
    });
    ctx.stroke(); ctx.setLineDash([]);
    var nom = histoBat.length > 1 ? 'Écran ' + (n + 1) + ' : ' : '';
    // Derniere recharge
    var dc = charges[n][charges[n].length - 1];
    // En charge d'apres la jauge, au dernier reveil (plus fiable que la tension)
    var st = statutCourant && (n ? statutCourant.s1 : statutCourant.s);
    var enCharge = !!(st && st.crate >= 2 && Date.now() - st.vu < 3 * 3600e3) || !!(dc && dc[2] && Date.now() / 60000 - dc[1] < 180);
    if (st && st.crate >= 2 && Date.now() - st.vu < 3 * 3600e3)
      texte.push(nom + 'en charge en ce moment (+' + String(st.crate).replace('.', ',') + ' % par heure).');
    else if (enCharge) texte.push(nom + 'en charge (ou branché) en ce moment.');
    else if (dc) {
      var fin = h.pts.filter(function (q) { return q[0] === dc[1]; })[0];
      texte.push(nom + 'dernière recharge ' + duree(Date.now() - dc[1] * 60000) + ' (jusqu\'à ' + Math.round(pctPoint(fin)) + ' %).');
    } else if (h.pts.length) texte.push(nom + 'pas de recharge sur les 30 derniers jours.');
    var e = estimation(h.pts);
    if (enCharge) { /* pas d'autonomie pendant une charge */ }
    else if (!h.pts.length) texte.push(nom + 'pas encore de mesure (un point par heure).');
    else if (!e) texte.push(nom + (dc ? "autonomie estimée une fois la tension stabilisée, environ 18 h après la recharge."
      : "pas encore assez de mesures pour estimer l'autonomie (une demi-journée)."));
    else if (e.pente >= -0.2) texte.push(nom + 'la batterie ne baisse presque pas (' + e.actuel + ' %).');
    else {
      var restant = e.actuel / -e.pente;
      texte.push(nom + 'environ ' + (-e.pente).toFixed(1).replace('.', ',') + ' % par jour : il reste à peu près ' +
        (restant < 2 ? Math.round(restant * 24) + ' heures' : Math.round(restant) + ' jours') + ' (' + e.actuel + ' %).');
    }
    // Temps passe hors veille : le meilleur indicateur de consommation sans multimetre
    var ev = eveilParJour(h.pts);
    if (ev) texte.push(nom + 'éveillé ' + enMinSec(ev.eveil) + ' par jour, dont ' + enMinSec(ev.ecran) + " d'écran (dernières 24 h).");
  });
  $('resumeBatterie').textContent = texte.join('\n') + (histoBat.length > 1 ? '\nTrait plein : écran 1, pointillés : écran 2.' : '');
  $('resumeBatterie').style.whiteSpace = 'pre-line';
}
// A l'ouverture du menu (si les reglages sont deja charges ; sinon, charger() s'en occupe)
$('menu-batterie').addEventListener('toggle', function () { if (this.open && config) chargerBatterie(); });
// Le dessin garde les couleurs du theme du moment ou il est fait : on le refait quand l'iPhone ou l'iPad
// passe du clair au sombre (ou l'inverse), au retour sur la page, et quand la largeur change (rotation)
(function () {
  var redessiner = function () { if (histoBat && $('menu-batterie').open) dessinerBatterie(joursBat); };
  try {
    var sombre = window.matchMedia('(prefers-color-scheme: dark)');
    if (sombre.addEventListener) sombre.addEventListener('change', redessiner); else if (sombre.addListener) sombre.addListener(redessiner);
  } catch (e) {}
  document.addEventListener('visibilitychange', function () { if (!document.hidden) redessiner(); });
  window.addEventListener('pageshow', redessiner);
  var largeur = 0, attente = null;
  window.addEventListener('resize', function () {
    var w = $('courbeBatterie').clientWidth;
    if (!w || w === largeur) return;
    largeur = w; clearTimeout(attente); attente = setTimeout(redessiner, 150);
  });
})();
</script>
