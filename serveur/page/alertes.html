<!-- Page web du cadre : menu Alertes sur l'iPhone (notifications ntfy) -->
<script>
// --- Alertes : reglages (enregistres avec le reste), sujet au hasard, essai, etat des surveillances ---
function remplirAlertes() {
  var a = config.alertes || {};
  $('alActif').checked = !!a.actif; $('alSujet').value = a.sujet || '';
  $('alMuet').checked = a.muet !== false; $('alBatterie').checked = a.batterie !== false; $('alBus').checked = a.bus !== false;
  choisirValeur($('alSeuil'), a.seuilBatterie || 20);
}
function lireAlertes() {
  return { actif: $('alActif').checked, sujet: $('alSujet').value.trim(), muet: $('alMuet').checked, batterie: $('alBatterie').checked,
    bus: $('alBus').checked, seuilBatterie: +$('alSeuil').value };
}
// Sujet tire au hasard : "cadre-" suivi de 20 lettres et chiffres (il tient lieu de mot de passe)
function genererSujet() {
  var lettres = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', o = new Uint8Array(20), s = 'cadre-';
  crypto.getRandomValues(o);
  for (var i = 0; i < o.length; i++) s += lettres[o[i] % lettres.length];
  $('alSujet').value = s;
  message('msgAlertes', "Sujet créé : abonne-toi à ce sujet dans l'application ntfy, envoie un essai, puis enregistre.");
  verifierModifs();
}
function essayerAlerte() {
  var sujet = $('alSujet').value.trim();
  if (!sujet) { message('msgAlertes', "Choisis d'abord un sujet (bouton « Générer un sujet »)."); return; }
  $('msgAlertes').textContent = 'Envoi…';
  api('/api/alertes/essai', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sujet: sujet }) })
    .then(function () { message('msgAlertes', "Notification d'essai envoyée : elle doit arriver sur l'iPhone en quelques secondes."); })
    .catch(function (e) { message('msgAlertes', 'Erreur : ' + e.message); });
}
// Ce que le serveur voit en ce moment pour chaque surveillance
var NOMS_ALERTES = { muet: 'Cadre', batterie: 'Batterie', bus: 'Bus' };
function chargerEtatAlertes() {
  api('/api/alertes').then(function (r) { return r.json(); }).then(function (d) {
    var z = $('etatAlertes'); z.innerHTML = '';
    d.etats.forEach(function (e) {
      var l = document.createElement('div'); l.className = e.probleme ? 'mauvais' : 'bon';
      var signe = document.createElement('span'); signe.className = 'signe'; signe.textContent = e.probleme ? '✗' : '✓';
      var t = document.createElement('span');
      t.textContent = NOMS_ALERTES[e.cle] + ' — ' + e.info + (e.envoyee ? ' (alerte envoyée le ' + new Date(e.envoyee).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + ')' : '');
      l.appendChild(signe); l.appendChild(t); z.appendChild(l);
    });
  }).catch(function (e) { $('etatAlertes').textContent = 'État indisponible : ' + e.message; });
}
$('menu-alertes').addEventListener('toggle', function () { if (this.open && config) chargerEtatAlertes(); });
</script>
