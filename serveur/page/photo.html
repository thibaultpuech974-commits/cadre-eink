<!-- Page web du cadre : menu Photo plein écran (cadrage au doigt et tramage dans le navigateur) -->
<script>
// --- Photo : cadrage (glisser, pincer, zoom) + tramage dans le navigateur ---
var bitsPhoto = null;
// Cadrage : point de la photo place au centre du cadre (cx, cy entre 0 et 1) et agrandissement (1 a 4)
var cadrage = { cx: 0.5, cy: 0.5, zoom: 1, w: 0, h: 0 };
$('fichier').onchange = function () {
  var f = this.files[0]; if (!f) return;
  var img = new Image();
  img.onload = function () {
    image = img; cadrage.cx = cadrage.cy = 0.5; cadrage.zoom = 1; $('zoomPhoto').value = '100';
    $('photoTramee').classList.add('cadrable'); $('outilsCadrage').classList.remove('cache');
    tramer();
  };
  img.src = URL.createObjectURL(f);
};
$('lum').oninput = tramer; $('contraste').oninput = tramer; $('tramage').onchange = tramer;
$('zoomPhoto').oninput = function () { cadrage.zoom = +this.value / 100; tramer(); };
var radios = document.getElementsByName('cadrage');
for (var i = 0; i < radios.length; i++) radios[i].onchange = tramer;
function recentrerPhoto() { cadrage.cx = cadrage.cy = 0.5; cadrage.zoom = 1; $('zoomPhoto').value = '100'; tramer(); }
// Pendant un geste, une seule image calculee par rafraichissement de l'ecran
var tramageDemande = false;
function demanderTramage() {
  if (tramageDemande) return;
  tramageDemande = true;
  requestAnimationFrame(function () { tramageDemande = false; tramer(); });
}
function zoomer(facteur) {
  cadrage.zoom = Math.max(1, Math.min(4, cadrage.zoom * facteur));
  $('zoomPhoto').value = String(Math.round(cadrage.zoom * 100));
}
// Gestes sur l'apercu : un doigt (ou la souris) deplace la photo, deux doigts l'agrandissent
(function () {
  var cv = $('photoTramee'), doigts = {};
  var ecart = function () { var k = Object.keys(doigts); return Math.hypot(doigts[k[0]].x - doigts[k[1]].x, doigts[k[0]].y - doigts[k[1]].y); };
  cv.addEventListener('pointerdown', function (e) {
    if (!image) return;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    doigts[e.pointerId] = { x: e.clientX, y: e.clientY };
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    var d = doigts[e.pointerId];
    if (!d || !image || !cadrage.w) return;
    var n = Object.keys(doigts).length, avant = n === 2 ? ecart() : 0;
    var echelle = cv.width / cv.getBoundingClientRect().width;      // points de l'image par point de l'ecran
    var dx = (e.clientX - d.x) * echelle / n, dy = (e.clientY - d.y) * echelle / n;
    d.x = e.clientX; d.y = e.clientY;
    cadrage.cx -= dx / cadrage.w; cadrage.cy -= dy / cadrage.h;
    if (n === 2 && avant > 10) zoomer(ecart() / avant);
    demanderTramage();
  });
  var fin = function (e) { delete doigts[e.pointerId]; };
  cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
  // Pincement sur un pave tactile (ou Ctrl + molette)
  cv.addEventListener('wheel', function (e) {
    if (!image || !e.ctrlKey) return;
    e.preventDefault();
    zoomer(Math.exp(-e.deltaY / 200)); demanderTramage();
  }, { passive: false });
})();

function tramer() {
  if (!image) return;
  // La photo est preparee "a l'endroit" selon l'orientation du cadre, sur toute la surface
  // (avec deux ecrans : les deux dalles et la jointure, cachee, pour que l'image reste continue)
  var rp = (config && config.affichage.rotation) || 0;
  var gP = grilleUI(rp);
  var LARG = gP.VL, HAUT = gP.VH;
  var c = document.createElement('canvas'); c.width = LARG; c.height = HAUT;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, LARG, HAUT);
  var remplir = document.querySelector('input[name=cadrage]:checked').value === 'remplir';
  var e = (remplir ? Math.max(LARG / image.width, HAUT / image.height) : Math.min(LARG / image.width, HAUT / image.height)) * cadrage.zoom;
  var w = image.width * e, h = image.height * e;
  // Le cadrage ne laisse jamais de vide la ou la photo peut couvrir le cadre ; plus petite que lui, elle reste centree
  var borne = function (v, demi) { return demi >= 0.5 ? 0.5 : Math.max(demi, Math.min(1 - demi, v)); };
  cadrage.cx = borne(cadrage.cx, LARG / 2 / w); cadrage.cy = borne(cadrage.cy, HAUT / 2 / h);
  cadrage.w = w; cadrage.h = h;
  ctx.drawImage(image, LARG / 2 - cadrage.cx * w, HAUT / 2 - cadrage.cy * h, w, h);
  var px = ctx.getImageData(0, 0, LARG, HAUT).data;
  var lum = +$('lum').value, k = +$('contraste').value / 100;
  var g = new Float32Array(LARG * HAUT);
  for (var j = 0; j < LARG * HAUT; j++) {
    var v = 0.299 * px[j * 4] + 0.587 * px[j * 4 + 1] + 0.114 * px[j * 4 + 2];
    g[j] = (v - 128) * k + 128 + lum;
  }
  // Floyd-Steinberg repartit toute l'erreur sur 4 voisins (nuances fines) ; Atkinson n'en repartit que
  // les trois quarts, sur 6 voisins : noirs et blancs plus francs, image plus contrastee
  var atkinson = $('tramage').value === 'atkinson';
  bitsPhoto = new Uint8Array(Math.ceil(LARG * HAUT / 8));
  for (var y = 0; y < HAUT; y++) for (var x = 0; x < LARG; x++) {
    var n = y * LARG + x, ancien = g[n], nouveau = ancien < 128 ? 0 : 255, err = ancien - nouveau;
    if (nouveau === 0) bitsPhoto[n >> 3] |= 0x80 >> (n & 7);
    if (atkinson) {
      err /= 8;
      if (x + 1 < LARG) g[n + 1] += err;
      if (x + 2 < LARG) g[n + 2] += err;
      if (y + 1 < HAUT) {
        if (x > 0) g[n + LARG - 1] += err;
        g[n + LARG] += err;
        if (x + 1 < LARG) g[n + LARG + 1] += err;
      }
      if (y + 2 < HAUT) g[n + 2 * LARG] += err;
      continue;
    }
    if (x + 1 < LARG) g[n + 1] += err * 7 / 16;
    if (y + 1 < HAUT) {
      if (x > 0) g[n + LARG - 1] += err * 3 / 16;
      g[n + LARG] += err * 5 / 16;
      if (x + 1 < LARG) g[n + LARG + 1] += err / 16;
    }
  }
  formeEcran($('photoTramee'), rp, LARG, HAUT);
  dessinerBits($('photoTramee'), bitsPhoto, LARG, HAUT);
  if (gP.J) {                                     // partie cachee par la jointure
    var cx = $('photoTramee').getContext('2d');
    cx.fillStyle = 'rgba(42,41,39,0.85)';
    if (gP.nx > 1) cx.fillRect(gP.L, 0, gP.J, HAUT); else cx.fillRect(0, gP.H, LARG, gP.J);
  }
  rotationPhoto = rp; grillePhoto = gP;
}
var grillePhoto = null;
// Decoupe l'image en une image par dalle (en "physique", comme la carte l'attend), mises bout a bout
function photoParEcran() {
  var g = grillePhoto, n = g.nx * g.ny, res = new Uint8Array(OCTETS * n);
  for (var e = 0; e < n; e++) {
    var ox = g.nx > 1 ? e * (g.L + g.J) : 0, oy = g.ny > 1 ? e * (g.H + g.J) : 0;
    var b = new Uint8Array(OCTETS);
    for (var y = 0; y < g.H; y++) for (var x = 0; x < g.L; x++) {
      if (!lireBit(bitsPhoto, (oy + y) * g.VL + ox + x)) continue;
      var k = y * g.L + x; b[k >> 3] |= 0x80 >> (k & 7);
    }
    res.set(logVersPhys(b, rotationPhoto), e * OCTETS);
  }
  return res;
}
var rotationPhoto = 0;
function envoyerPhoto() {
  if (!bitsPhoto) { message('msgPhoto', "Choisis d'abord une photo."); return; }
  api('/api/photo?r=' + rotationPhoto, { method: 'POST', headers: { 'content-type': 'application/octet-stream' }, body: photoParEcran() })
    .then(function () { message('msgPhoto', 'Photo envoyée : elle s\'affichera au prochain réveil du cadre.'); return rafraichir(); })
    .catch(function (e) { message('msgPhoto', 'Erreur : ' + e.message); });
}
</script>
