<!-- Page web du cadre : groupes de menus, menus déroulants, textes d'aide repliables, démarrage de la page (toujours en dernier) -->
<script>
// --- Menus deroulants : on retient ceux qui sont ouverts (sur cet appareil) ---
var menus = document.querySelectorAll('details.menu');
var menusOuverts = [];
try { menusOuverts = JSON.parse(localStorage.getItem('cadre-menus') || '[]'); } catch (e) {}
for (var i = 0; i < menus.length; i++) {
  if (menusOuverts.indexOf(menus[i].id) >= 0) menus[i].open = true;
  menus[i].addEventListener('toggle', function () {
    var ouverts = [];
    for (var k = 0; k < menus.length; k++) if (menus[k].open) ouverts.push(menus[k].id);
    try { localStorage.setItem('cadre-menus', JSON.stringify(ouverts)); } catch (e) {}
  });
}
// --- Trois groupes de menus (Contenu, Cadre, Systeme) : un seul est affiche a la fois, on retient lequel ---
var groupeCourant = 'contenu';
function choisirGroupe(g) {
  if (!$('groupe-' + g)) g = 'contenu';
  groupeCourant = g;
  var groupes = document.querySelectorAll('.groupe'), onglets = document.querySelectorAll('.onglets button');
  for (var k = 0; k < groupes.length; k++) groupes[k].classList.toggle('cache', groupes[k].id !== 'groupe-' + g);
  for (var k = 0; k < onglets.length; k++) {
    var choisi = onglets[k].getAttribute('data-groupe') === g;
    onglets[k].classList.toggle('actif', choisi); onglets[k].setAttribute('aria-selected', choisi ? 'true' : 'false');
  }
  try { localStorage.setItem('cadre-groupe', g); } catch (e) {}
}
try { groupeCourant = localStorage.getItem('cadre-groupe') || 'contenu'; } catch (e) {}
choisirGroupe(groupeCourant);
// Ouvre un menu, dans son groupe, et l'amene a l'ecran (pour un message a ne pas manquer)
function montrerMenu(id) {
  var m = $(id);
  if (!m) return;
  choisirGroupe(m.parentNode.id.replace('groupe-', ''));
  m.open = true;
  if (m.scrollIntoView) m.scrollIntoView({ block: 'nearest' });
}
// "Tout ouvrir" et "Tout fermer" : les menus du groupe affiche
function toutesLesSections(ouvrir) { for (var k = 0; k < menus.length; k++) if (menus[k].parentNode.id === 'groupe-' + groupeCourant) menus[k].open = ouvrir; }
// Textes repliables : le contenu va dans <span class="texte">, suivi du lien "plus" / "moins"
function preparerRepliable(p) {
  if (p.querySelector(':scope > .texte')) return p.querySelector(':scope > .texte');
  var t = document.createElement('span'); t.className = 'texte';
  while (p.firstChild) t.appendChild(p.firstChild);
  var a = document.createElement('a'); a.href = '#'; a.className = 'bascule'; a.textContent = 'plus';
  a.onclick = function () {
    var ouvert = p.classList.toggle('ouvert');
    a.textContent = ouvert ? 'moins' : 'plus';
    if (p.closest('#panneauPrevisu') && previsuActive) placerPanneau();
    return false;
  };
  p.appendChild(t); p.appendChild(document.createTextNode(' ')); p.appendChild(a);
  return t;
}
var repliables = document.querySelectorAll('.repliable');
for (var i = 0; i < repliables.length; i++) preparerRepliable(repliables[i]);
demarrer();
setInterval(function () { if (config) rafraichir().catch(function () {}); }, 60000);
</script>
